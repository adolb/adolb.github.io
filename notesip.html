<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <title>Notes - Connection Status & Reload</title>
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        /* --- CSS VARIABLES UNTUK THEME (SIANG/MALAM) --- */
        :root {
            --bg-main: #fafbfc;
            --text-main: #1a1a1a;
            --text-muted: #8e8e93;
            --card-bg: #ffffff;
            --card-border: #f0f0f0;
            --card-shadow: rgba(0, 0, 0, 0.04);
            --header-bg: rgba(250, 251, 252, 0.85);
            --search-bg: #eef0f5;
            --detail-bg: rgba(255, 255, 255, 0.9);
            --input-placeholder: #c7c7cc;
            --popup-shadow: rgba(0, 0, 0, 0.1);
        }

        body.dark-mode {
            --bg-main: #121212;
            --text-main: #ffffff;
            --text-muted: #98989d;
            --card-bg: #1c1c1e;
            --card-border: #2c2c2e;
            --card-shadow: rgba(0, 0, 0, 0.4);
            --header-bg: rgba(18, 18, 18, 0.85);
            --search-bg: #2c2c2e;
            --detail-bg: rgba(18, 18, 18, 0.9);
            --input-placeholder: #636366;
            --popup-shadow: rgba(0, 0, 0, 0.5);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Display", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-main);
            color: var(--text-main);
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: background-color 0.3s, color 0.3s;
        }

        .app-container {
            width: 100%;
            height: 100%;
            background-color: var(--bg-main);
            position: relative;
            overflow: hidden;
        }

        /* Transisi Halaman */
        .view-section {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: var(--bg-main);
            display: flex;
            flex-direction: column;
            transition: transform 0.5s cubic-bezier(0.32, 0.72, 0, 1), opacity 0.5s cubic-bezier(0.32, 0.72, 0, 1), background-color 0.3s;
            z-index: 1;
        }

        ::-webkit-scrollbar { width: 0px; background: transparent; }

        /* --- HALAMAN 1: LIST NOTES --- */
        #list-view.hidden {
            transform: scale(0.95) translateX(-10%);
            opacity: 0.5;
            pointer-events: none;
        }

        .list-header {
            padding: 50px 24px 15px 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: var(--header-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            z-index: 10;
            position: sticky;
            top: 0;
            transition: background-color 0.3s;
        }

        .header-left, .header-right {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .theme-toggle-btn, .reload-btn {
            font-size: 20px;
            color: var(--text-main);
            cursor: pointer;
            transition: transform 0.2s;
        }
        .theme-toggle-btn:active, .reload-btn:active { transform: scale(0.8); }
        .reload-btn.spinning i {
            animation: spin 1s linear infinite;
        }
        @keyframes spin { 100% { transform: rotate(360deg); } }

        .header-right i {
            font-size: 20px;
            color: var(--text-main);
            cursor: pointer;
        }

        .list-header h1 {
            font-size: 22px;
            font-weight: 600;
            letter-spacing: -0.5px;
            text-align: center;
        }

        /* --- STATUS BAR KONEKSI --- */
        .connection-status-bar {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 6px 12px;
            font-size: 12px;
            font-weight: 500;
            background: var(--card-bg);
            border-bottom: 1px solid var(--card-border);
            transition: background-color 0.3s, color 0.3s;
        }

        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background-color: #8e8e93;
        }
        .status-dot.connected { background-color: #34A853; box-shadow: 0 0 6px rgba(52, 168, 83, 0.6); }
        .status-dot.disconnected { background-color: #EA4335; box-shadow: 0 0 6px rgba(234, 67, 53, 0.6); }

        .sub-header {
            padding: 10px 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            color: var(--text-muted);
            font-size: 14px;
            font-weight: 500;
        }

        .search-bar-container {
            padding: 0 24px;
            margin-bottom: 15px;
            display: none; 
        }
        .search-bar-container.active { display: block; }

        .search-input {
            width: 100%;
            background: var(--search-bg);
            border: none;
            padding: 12px 12px 12px 40px;
            border-radius: 12px;
            color: var(--text-main);
            font-size: 16px;
            outline: none;
            transition: background-color 0.3s, color 0.3s;
        }
        .search-input::placeholder { color: var(--text-muted); }

        .search-wrapper { position: relative; }
        .search-wrapper i {
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-muted);
            font-size: 16px;
        }

        .notes-list {
            flex: 1;
            overflow-y: auto;
            padding: 10px 24px 100px 24px;
        }

        /* --- STYLE KARTU --- */
        .note-card-item {
            background: var(--card-bg);
            border-radius: 16px;
            margin-bottom: 16px;
            cursor: pointer;
            transition: transform 0.2s cubic-bezier(0.25, 1, 0.5, 1), box-shadow 0.2s, background-color 0.3s, border-color 0.3s;
            box-shadow: 0 4px 15px var(--card-shadow);
            display: flex;
            overflow: hidden;
            border: 1px solid var(--card-border);
            position: relative;
        }

        .note-card-item:active { transform: scale(0.97); }

        .card-color-bar { width: 8px; flex-shrink: 0; }
        .color-blue { background-color: #4285F4; }
        .color-yellow { background-color: #FBBC05; }
        .color-red { background-color: #EA4335; }
        .color-green { background-color: #34A853; }

        .card-content {
            padding: 18px 16px;
            flex: 1;
            min-width: 0;
        }

        .card-header-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
        }

        .note-card-title {
            font-size: 16px;
            font-weight: 700;
            color: var(--text-main);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            flex: 1;
        }

        .card-dots {
            color: var(--text-muted);
            font-size: 16px;
            margin-left: 10px;
            padding: 4px 8px;
            cursor: pointer;
        }
        .card-dots:active { opacity: 0.5; }

        .note-card-snippet {
            font-size: 14px;
            color: var(--text-muted);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            line-height: 1.4;
        }

        /* --- POPUP MENU (DROPDOWN) --- */
        .dropdown-menu {
            position: fixed;
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 12px;
            box-shadow: 0 8px 24px var(--popup-shadow);
            width: 160px;
            z-index: 9999;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            opacity: 0;
            pointer-events: none;
            transform: scale(0.95);
            transition: opacity 0.2s, transform 0.2s;
        }
        .dropdown-menu.active {
            opacity: 1;
            pointer-events: auto;
            transform: scale(1);
        }
        .dropdown-item {
            padding: 14px 16px;
            color: var(--text-main);
            font-size: 15px;
            font-weight: 500;
            cursor: pointer;
            border-bottom: 1px solid var(--card-border);
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .dropdown-item i { font-size: 16px; width: 16px; text-align: center;}
        .dropdown-item:last-child { border-bottom: none; }
        .dropdown-item:active { background: var(--search-bg); }
        .dropdown-item.delete-text { color: #ff453a; }

        /* FAB Button */
        .fab {
            position: fixed;
            bottom: 30px;
            right: 24px;
            width: 60px;
            height: 60px;
            border-radius: 50%;
            background-color: #4285F4;
            color: #ffffff;
            border: none;
            font-size: 24px;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 8px 20px rgba(66, 133, 244, 0.4);
            cursor: pointer;
            z-index: 100;
            transition: transform 0.2s;
        }
        .fab:active { transform: scale(0.9); }

        /* --- HALAMAN 2: DETAIL --- */
        #detail-view {
            transform: translateX(100%);
            z-index: 2;
        }

        #detail-view.active { transform: translateX(0); }

        .detail-nav-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 50px 16px 12px 16px;
            background: var(--detail-bg);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            border-bottom: 1px solid var(--card-border);
            position: sticky;
            top: 0;
            z-index: 10;
        }

        .back-btn {
            background: none;
            border: none;
            color: var(--text-main);
            font-size: 17px;
            font-weight: 500;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .back-btn i { font-size: 20px; }

        .save-indicator {
            font-size: 14px;
            color: var(--text-muted);
            font-weight: 400;
        }

        .detail-body {
            flex: 1;
            display: flex;
            flex-direction: column;
            padding: 24px 24px;
            overflow-y: auto;
        }

        .detail-title-input {
            width: 100%;
            background: transparent;
            border: none;
            color: var(--text-main);
            font-size: 28px;
            font-weight: 700;
            outline: none;
            margin-bottom: 20px;
        }
        .detail-title-input::placeholder { color: var(--input-placeholder); }

        .detail-textarea {
            width: 100%;
            flex: 1;
            min-height: 400px;
            background: transparent;
            border: none;
            color: var(--text-main);
            font-size: 17px;
            line-height: 1.6;
            outline: none;
            resize: none;
        }
        .detail-textarea::placeholder { color: var(--input-placeholder); }
    </style>
</head>
<body>

    <!-- OVERLAY POPUP MENU -->
    <div id="dropdown-menu" class="dropdown-menu">
        <div class="dropdown-item" onclick="handleMenuAction('copy')">
            <i class="fa-regular fa-copy"></i> Copy
        </div>
        <div class="dropdown-item" onclick="handleMenuAction('duplicate')">
            <i class="fa-regular fa-clone"></i> Duplikasikan
        </div>
        <div class="dropdown-item delete-text" onclick="handleMenuAction('delete')">
            <i class="fa-regular fa-trash-can"></i> Hapus
        </div>
    </div>

    <div class="app-container">
        
        <!-- HALAMAN 1: DAFTAR NOTES -->
        <div id="list-view" class="view-section">
            <div class="list-header">
                <div class="header-left">
                    <div class="theme-toggle-btn" onclick="toggleTheme()" title="Ganti Tema">
                        <i class="fa-solid fa-moon" id="theme-icon"></i>
                    </div>
                    <div class="reload-btn" id="reload-btn" onclick="manualReload()" title="Muat Ulang Catatan">
                        <i class="fa-solid fa-rotate-right"></i>
                    </div>
                </div>
                <h1>Notes</h1>
                <div class="header-right">
                    <i class="fa-solid fa-magnifying-glass" onclick="toggleSearch()"></i>
                </div>
            </div>

            <!-- Status Koneksi Supabase -->
            <div class="connection-status-bar" id="connection-status-bar">
                <div class="status-dot" id="status-dot"></div>
                <span id="status-text">Memeriksa koneksi...</span>
            </div>

            <div class="search-bar-container" id="search-container">
                <div class="search-wrapper">
                    <i class="fa-solid fa-magnifying-glass"></i>
                    <input type="text" class="search-input" placeholder="Cari catatan..." id="search-box" oninput="filterNotes()">
                </div>
            </div>

            <div class="sub-header">
                <span>Catatan Anda</span>
                <i class="fa-solid fa-arrow-down-short-wide"></i>
            </div>

            <div class="notes-list" id="notes-list-container">
                <!-- Daftar catatan akan dimuat di sini -->
            </div>

            <button class="fab" onclick="createNewNote()">
                <i class="fa-solid fa-plus"></i>
            </button>
        </div>

        <!-- HALAMAN 2: DETAIL FULL SCREEN -->
        <div id="detail-view" class="view-section">
            <div class="detail-nav-bar">
                <button class="back-btn" onclick="goBackToList()"><i class="fa-solid fa-chevron-left"></i></button>
                <span class="save-indicator" id="detail-status">Tersimpan</span>
            </div>
            <div class="detail-body">
                <input type="text" class="detail-title-input" id="active-title" placeholder="Judul Catatan">
                <textarea class="detail-textarea" id="active-content" placeholder="Mulai mengetik..."></textarea>
            </div>
        </div>

    </div>

    <script>
        const SUPABASE_URL = 'https://awlxjzfadktcthbumxle.supabase.co'; 
        const API_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImF3bHhqemZhZGt0Y3RoYnVteGxlIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODM3ODU3NzgsImV4cCI6MjA5OTM2MTc3OH0.ktRLTXfsYmzb5RH8qKci0FgENkqqVG9atz5sHls9RXI';

        const getHeaders = () => ({
            'apikey': API_KEY,
            'Authorization': `Bearer ${API_KEY}`,
            'Content-Type': 'application/json',
            'Prefer': 'resolution=merge-duplicates'
        });

        let notesData = {};
        let currentActiveId = null;
        let saveTimeout = null;
        const colorClasses = ['color-blue', 'color-yellow', 'color-red', 'color-green'];

        // --- UPDATE STATUS KONEKSI UI ---
        function updateConnectionStatus(isConnected, message = "") {
            const dot = document.getElementById('status-dot');
            const text = document.getElementById('status-text');
            if (isConnected) {
                dot.className = "status-dot connected";
                text.innerText = message || "Terhubung ke Supabase";
            } else {
                dot.className = "status-dot disconnected";
                text.innerText = message || "Tidak terhubung / Offline";
            }
        }

        // --- SMART TITLE ---
        function getSmartTitle(title, content) {
            if (title && title.trim() !== '') {
                return title.trim();
            }
            if (content && content.trim() !== '') {
                const words = content.trim().split(/\s+/);
                return words.slice(0, 3).join(' ');
            }
            return "Catatan Baru";
        }

        function toggleTheme() {
            const body = document.body;
            const icon = document.getElementById('theme-icon');
            body.classList.toggle('dark-mode');
            if (body.classList.contains('dark-mode')) {
                icon.className = 'fa-solid fa-sun';
            } else {
                icon.className = 'fa-solid fa-moon';
            }
        }

        window.addEventListener('DOMContentLoaded', async () => {
            await fetchNotes();
        });

        // --- TOMBOL RELOAD MANUAL ---
        async function manualReload() {
            const reloadBtn = document.getElementById('reload-btn');
            reloadBtn.classList.add('spinning');
            await fetchNotes();
            setTimeout(() => {
                reloadBtn.classList.remove('spinning');
            }, 500);
        }

        function toggleSearch() {
            const searchContainer = document.getElementById('search-container');
            searchContainer.classList.toggle('active');
            if(searchContainer.classList.contains('active')){
                document.getElementById('search-box').focus();
            }
        }

        async function fetchNotes() {
            try {
                const response = await fetch(`${SUPABASE_URL}/rest/v1/notes?select=*`, {
                    method: 'GET',
                    headers: getHeaders()
                });
                if (!response.ok) throw new Error("Gagal mengambil data");
                const data = await response.json();

                notesData = {};
                if (data && data.length > 0) {
                    data.forEach(note => {
                        notesData[note.id] = {
                            id: String(note.id),
                            title: note.title || "",
                            content: note.content || "",
                            x: note.x || 50, y: note.y || 50, w: note.w || 580, h: note.h || 400,
                            zIndex: note.z_index || 10
                        };
                    });
                }
                renderNotesList();
                updateConnectionStatus(true, "Terhubung ke Supabase");
            } catch (e) {
                console.error(e);
                updateConnectionStatus(false, "Gagal terhubung ke Supabase");
            }
        }

        function renderNotesList(filterText = "") {
            const container = document.getElementById('notes-list-container');
            container.innerHTML = '';

            const keys = Object.keys(notesData);
            if (keys.length === 0) {
                container.innerHTML = '<p style="color: var(--text-muted); text-align: center; margin-top: 50px; font-size: 15px;">Belum ada catatan.</p>';
                return;
            }

            keys.reverse().forEach((id, index) => {
                const note = notesData[id];
                const displayTitle = getSmartTitle(note.title, note.content);

                if (filterText && !displayTitle.toLowerCase().includes(filterText.toLowerCase()) && !note.content.toLowerCase().includes(filterText.toLowerCase())) {
                    return;
                }

                const colorClass = colorClasses[index % colorClasses.length];

                const item = document.createElement('div');
                item.className = 'note-card-item';
                item.onclick = () => openDetailNote(id);
                item.innerHTML = `
                    <div class="card-color-bar ${colorClass}"></div>
                    <div class="card-content">
                        <div class="card-header-row">
                            <div class="note-card-title">${escapeHtml(displayTitle)}</div>
                            <div class="card-dots" onclick="openMenu(event, '${id}')"><i class="fa-solid fa-ellipsis-vertical"></i></div>
                        </div>
                        <div class="note-card-snippet">${escapeHtml(note.content || '...')}</div>
                    </div>
                `;
                container.appendChild(item);
            });
        }

        function filterNotes() {
            const query = document.getElementById('search-box').value;
            renderNotesList(query);
        }

        let activeMenuNoteId = null;

        function openMenu(event, id) {
            event.stopPropagation();
            activeMenuNoteId = id;
            
            const menu = document.getElementById('dropdown-menu');
            let xPos = event.clientX - 130; 
            let yPos = event.clientY;
            
            menu.style.left = `${xPos}px`;
            menu.style.top = `${yPos}px`;
            menu.classList.add('active');
        }

        document.addEventListener('click', () => {
            const menu = document.getElementById('dropdown-menu');
            if (menu.classList.contains('active')) {
                menu.classList.remove('active');
                activeMenuNoteId = null;
            }
        });

        async function handleMenuAction(action) {
            if (!activeMenuNoteId) return;
            const targetId = activeMenuNoteId;
            const note = notesData[targetId];

            if (action === 'copy') {
                const displayTitle = getSmartTitle(note.title, note.content);
                const textToCopy = `Judul: ${displayTitle}\nIsi: ${note.content}`;
                navigator.clipboard.writeText(textToCopy).then(() => {
                    alert("Catatan berhasil disalin!");
                });
            } else if (action === 'duplicate') {
                await duplicateNote(targetId);
            } else if (action === 'delete') {
                await deleteSpecificNote(targetId);
            }
        }

        async function duplicateNote(id) {
            const oldNote = notesData[id];
            const newId = 'note_' + Date.now();
            
            const displayTitle = getSmartTitle(oldNote.title, oldNote.content);
            let newTitle = `${displayTitle} 2`;

            notesData[newId] = {
                id: newId,
                title: newTitle,
                content: oldNote.content,
                x: 50, y: 50, w: 580, h: 400, zIndex: 99
            };
            
            renderNotesList();
            await syncNoteToSupabase(newId);
        }

        async function deleteSpecificNote(id) {
            if (!confirm("Hapus catatan ini secara permanen?")) return;
            delete notesData[id];
            renderNotesList();
            try {
                const response = await fetch(`${SUPABASE_URL}/rest/v1/notes?id=eq.${id}`, {
                    method: 'DELETE',
                    headers: getHeaders()
                });
                if(response.ok) updateConnectionStatus(true, "Terhubung ke Supabase");
            } catch (e) {
                console.error(e);
                updateConnectionStatus(false, "Gagal terhubung ke Supabase");
            }
        }

        function openDetailNote(id) {
            currentActiveId = id;
            const note = notesData[id];

            document.getElementById('active-title').value = note.title;
            document.getElementById('active-content').value = note.content;
            document.getElementById('detail-status').innerText = "Tersimpan";

            document.getElementById('detail-view').classList.add('active');
            document.getElementById('list-view').classList.add('hidden');
        }

        function goBackToList() {
            document.getElementById('detail-view').classList.remove('active');
            document.getElementById('list-view').classList.remove('hidden');
            renderNotesList();
        }

        async function createNewNote() {
            const id = 'note_' + Date.now();
            notesData[id] = { id: id, title: "", content: "", x: 50, y: 50, w: 580, h: 400, zIndex: 99 };
            renderNotesList();
            openDetailNote(id);
            await syncNoteToSupabase(id);
        }

        const activeTitleInput = document.getElementById('active-title');
        const activeContentInput = document.getElementById('active-content');

        const handleInputChanges = () => {
            if (!currentActiveId || !notesData[currentActiveId]) return;
            document.getElementById('detail-status').innerText = "Menyimpan...";
            notesData[currentActiveId].title = activeTitleInput.value;
            notesData[currentActiveId].content = activeContentInput.value;

            clearTimeout(saveTimeout);
            saveTimeout = setTimeout(async () => {
                await syncNoteToSupabase(currentActiveId);
            }, 600);
        };

        activeTitleInput.addEventListener('input', handleInputChanges);
        activeContentInput.addEventListener('input', handleInputChanges);

        async function syncNoteToSupabase(id) {
            const note = notesData[id];
            if (!note) return;
            const payload = {
                id: String(note.id), title: String(note.title || ''), content: String(note.content || ''),
                x: Math.round(Number(note.x) || 50), y: Math.round(Number(note.y) || 50),
                w: Math.round(Number(note.w) || 580), h: Math.round(Number(note.h) || 400),
                z_index: Math.round(Number(note.zIndex) || 10), updated_at: new Date().toISOString()
            };
            try {
                const response = await fetch(`${SUPABASE_URL}/rest/v1/notes`, {
                    method: 'POST', headers: getHeaders(), body: JSON.stringify(payload)
                });
                if (response.ok) {
                    document.getElementById('detail-status').innerText = "Tersimpan";
                    updateConnectionStatus(true, "Terhubung ke Supabase");
                } else {
                    throw new Error();
                }
            } catch (e) {
                console.error(e);
                document.getElementById('detail-status').innerText = "Gagal menyimpan (Offline)";
                updateConnectionStatus(false, "Tidak terhubung ke Supabase");
            }
        }

        function escapeHtml(text) {
            return text
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#039;");
        }
    </script>
</body>
</html>
