<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Mac Notes">
    
    <title>macOS Dark Mode Notepad</title>
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Interact.js -->
    <script src="https://cdn.jsdelivr.net/npm/interactjs/dist/interact.min.js"></script>
    
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            touch-action: none;
        }

        body {
            background-color: #1a1a2e;
            background-image: url('https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?q=80&w=2564&auto=format&fit=crop');
            background-size: cover;
            background-position: center;
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            position: relative;
        }

        .global-tools {
            position: absolute;
            top: 12px;
            right: 16px;
            z-index: 999999;
        }

        #desktop {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            overflow: hidden;
        }

        .mac-dark-widget {
            position: absolute;
            width: 580px;
            height: 400px;
            background: #282829;
            border: 1px solid #404040;
            border-radius: 10px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4), 0 0 0 1px rgba(255,255,255,0.05) inset;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            min-width: 320px;
            min-height: 200px;
            color: #ffffff;
        }

        .title-bar {
            height: 28px;
            display: flex;
            align-items: center;
            padding: 0 12px;
            cursor: move;
            user-select: none;
            -webkit-user-select: none;
            position: relative;
            background: #282829;
            flex-shrink: 0;
        }

        .mac-controls {
            display: flex;
            gap: 8px;
            position: absolute;
            left: 12px;
        }

        .mac-btn {
            border: none;
            width: 12px;
            height: 12px;
            border-radius: 50%;
            cursor: pointer;
        }
        .mac-btn.close { background: #ff5f56; }
        .mac-btn.minimize { background: #ffbd2e; }
        .mac-btn.maximize { background: #27c93f; }

        .toolbar {
            display: flex;
            align-items: center;
            padding: 4px 16px 12px 16px;
            border-bottom: 1px solid #1a1a1a;
            gap: 16px;
            flex-shrink: 0;
        }

        .nav-icons { display: flex; gap: 12px; color: #8c8c8e; font-size: 14px; }
        .toolbar-title { font-size: 13px; font-weight: 600; color: #ffffff; }

        .app-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 16px;
            background: #282829;
            gap: 12px;
            flex-shrink: 0;
        }

        .app-info-left { display: flex; align-items: center; gap: 12px; flex: 1; }
        .app-icon {
            width: 32px; height: 32px; background: #ffcc00; border-radius: 8px;
            display: flex; align-items: center; justify-content: center; font-size: 18px; color: #000; flex-shrink: 0;
        }

        .app-text { display: flex; flex-direction: column; gap: 2px; flex: 1; }

        .note-title-input {
            background: #1e1e1e; border: 1px solid #3e3e40; color: #ffffff;
            font-size: 13px; font-weight: 600; padding: 2px 6px; border-radius: 4px; outline: none; width: 100%; max-width: 200px;
        }
        .note-title-input:focus { border-color: #007aff; }
        .app-text p { font-size: 11px; color: #98989d; margin: 0; }

        .notepad-container {
            display: flex; 
            flex-direction: column; 
            background: #1e1e1e;
            border-top: 1px solid #1a1a1a; 
            border-bottom: 1px solid #1a1a1a;
            flex-grow: 1;
        }

        .notepad-container textarea {
            width: 100%; 
            background: transparent; 
            border: none; 
            outline: none;
            color: #e0e0e0; 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            font-size: 13px; 
            line-height: 1.6; 
            padding: 12px 16px; 
            resize: none; 
            touch-action: auto;
            height: 100%;
            overflow-y: auto;
        }

        .window-footer {
            display: flex; justify-content: space-between; align-items: center; padding: 12px 16px; background: #282829;
            flex-shrink: 0;
        }
        .breadcrumb { font-size: 11px; color: #98989d; display: flex; align-items: center; gap: 4px; }
        .btn-blue {
            background: #007aff; border: none; color: #fff; padding: 6px 16px;
            border-radius: 5px; font-size: 12px; font-weight: 500; cursor: pointer; box-shadow: 0 2px 10px rgba(0,122,255,0.4);
        }

        /* KHUSUS PORTRAIT (PONSEL) */
        @media (orientation: portrait) {
            body {
                overflow: hidden;
            }
            #desktop {
                position: absolute;
                top: 70px;
                left: 0; right: 0; bottom: 0;
                display: flex !important;
                flex-direction: column;
                gap: 16px;
                /* Padding bawah diperbesar hingga 150px agar bisa scroll leluasa melewati window terakhir */
                padding: 0 0 150px 0;
                overflow-y: auto !important; 
                align-items: stretch;
            }
            .global-tools {
                top: 16px; right: auto; left: 50%;
                transform: translateX(-50%);
            }
            .mac-dark-widget {
                position: relative !important;
                transform: none !important;
                width: 100% !important; 
                max-width: 100% !important;
                min-height: 200px;
                margin-bottom: 0px;
                border-radius: 0px;
                border-left: none;
                border-right: none;
            }
            .mac-dark-widget > div[id^="content_"] {
                height: 100% !important;
                display: flex;
                flex-direction: column;
            }
            .notepad-container {
                flex-grow: 1 !important;
            }
            .notepad-container textarea {
                height: 100% !important; 
                overflow-y: auto !important;
            }
        }
    </style>
</head>
<body>

    <div class="global-tools">
        <button class="btn-blue" onclick="createNewNote()"><i class="fa-solid fa-plus"></i> Tambah Note</button>
    </div>

    <div id="desktop"></div>

    <script>
        const SUPABASE_URL = 'https://awlxjzfadktcthbumxle.supabase.co'; 
        const API_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImF3bHhqemZhZGt0Y3RoYnVteGxlIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODM3ODU3NzgsImV4cCI6MjA5OTM2MTc3OH0.ktRLTXfsYmzb5RH8qKci0FgENkqqVG9atz5sHls9RXI';

        const getHeaders = () => ({
            'apikey': API_KEY,
            'Authorization': `Bearer ${API_KEY}`,
            'Content-Type': 'application/json',
            'Prefer': 'resolution=merge-duplicates'
        });

        let notesData = {};
        let highestZIndex = 10;

        const isPortrait = () => window.matchMedia("(orientation: portrait)").matches;

        window.addEventListener('DOMContentLoaded', async () => {
            setupInteractJS();
            await fetchNotesFromSupabase();
        });

        async function fetchNotesFromSupabase() {
            try {
                const response = await fetch(`${SUPABASE_URL}/rest/v1/notes?select=*`, {
                    method: 'GET',
                    headers: getHeaders()
                });
                if (!response.ok) throw new Error("Gagal load");
                const data = await response.json();

                if (!data || data.length === 0) {
                    await createNewNote("Catatan Kosong");
                } else {
                    notesData = {};
                    data.forEach(note => {
                        notesData[note.id] = {
                            id: String(note.id),
                            title: note.title || "Tanpa Judul",
                            content: note.content || "",
                            x: Number(note.x) || 50,
                            y: Number(note.y) || 50,
                            w: Number(note.w) || 580,
                            h: Number(note.h) || 400,
                            zIndex: Number(note.z_index) || 10
                        };
                    });
                    renderAllOpenWindows();
                }
            } catch (e) { console.error(e); }
        }

        async function syncNoteToSupabase(id) {
            const note = notesData[id];
            if (!note) return;
            const saveStatus = document.getElementById(`status_${id}`);
            const payload = {
                id: String(note.id),
                title: String(note.title || ''),
                content: String(note.content || ''),
                x: Math.round(Number(note.x) || 50),
                y: Math.round(Number(note.y) || 50),
                w: Math.round(Number(note.w) || 580),
                h: Math.round(Number(note.h) || 400),
                z_index: Math.round(Number(note.zIndex) || 10),
                updated_at: new Date().toISOString()
            };

            try {
                const response = await fetch(`${SUPABASE_URL}/rest/v1/notes`, {
                    method: 'POST',
                    headers: getHeaders(),
                    body: JSON.stringify(payload)
                });
                if (response.ok && saveStatus) {
                    saveStatus.innerText = "Tersimpan";
                }
            } catch (e) {}
        }

        async function createNewNote(customTitle) {
            const id = 'note_' + Date.now();
            notesData[id] = {
                id: id,
                title: customTitle || `Catatan Baru`,
                content: "",
                x: 50 + (Object.keys(notesData).length * 20),
                y: 50 + (Object.keys(notesData).length * 20),
                w: 580,
                h: 300,
                zIndex: ++highestZIndex
            };
            renderWindow(id);
            await syncNoteToSupabase(id);
        }

        async function deleteNote(id) {
            delete notesData[id];
            const el = document.getElementById(id);
            if (el) el.remove();
            try {
                await fetch(`${SUPABASE_URL}/rest/v1/notes?id=eq.${id}`, { method: 'DELETE', headers: getHeaders() });
            } catch(e){}
        }

        function toggleMinimize(id) {
            if (isPortrait()) return;
            const content = document.getElementById(`content_${id}`);
            const win = document.getElementById(id);
            if (content.style.display === "none") {
                content.style.display = "flex";
                win.style.height = (notesData[id].h || 400) + 'px';
            } else {
                content.style.display = "none";
                win.style.height = "28px";
            }
        }

        function toggleMaximize(id) {
            if (isPortrait()) return;
            const win = document.getElementById(id);
            if (!win.dataset.maximized || win.dataset.maximized === "false") {
                win.dataset.oldW = win.style.width;
                win.dataset.oldH = win.style.height;
                win.dataset.oldTransform = win.style.transform;
                win.style.width = '100vw';
                win.style.height = '100vh';
                win.style.transform = 'translate(0px, 0px)';
                win.dataset.maximized = "true";
            } else {
                win.style.width = win.dataset.oldW;
                win.style.height = win.dataset.oldH;
                win.style.transform = win.dataset.oldTransform;
                win.dataset.maximized = "false";
            }
        }

        function bringToFront(id) {
            if (notesData[id] && notesData[id].zIndex !== highestZIndex) {
                highestZIndex++;
                notesData[id].zIndex = highestZIndex;
                const el = document.getElementById(id);
                if (el) el.style.zIndex = highestZIndex;
            }
        }

        function renderAllOpenWindows() {
            document.getElementById('desktop').innerHTML = '';
            for (let id in notesData) renderWindow(id);
        }

        function renderWindow(id) {
            const note = notesData[id];
            const desktop = document.getElementById('desktop');

            const win = document.createElement('div');
            win.id = note.id;
            win.className = 'mac-dark-widget';
            win.style.width = isPortrait() ? '100%' : (note.w + 'px');
            win.style.height = (note.h || 300) + 'px';
            win.style.zIndex = note.zIndex;
            win.style.transform = isPortrait() ? 'none' : `translate(${note.x}px, ${note.y}px)`;
            win.setAttribute('data-x', note.x);
            win.setAttribute('data-y', note.y);
            
            win.addEventListener('mousedown', () => bringToFront(note.id));

            win.innerHTML = `
                <div class="title-bar drag-handle">
                    <div class="mac-controls">
                        <button class="mac-btn close" onclick="deleteNote('${note.id}')" title="Hapus"></button>
                        <button class="mac-btn minimize" onclick="toggleMinimize('${note.id}')" title="Minimize"></button>
                        <button class="mac-btn maximize" onclick="toggleMaximize('${note.id}')" title="Maximize"></button>
                    </div>
                </div>

                <div id="content_${note.id}" style="display: flex; flex-direction: column; flex: 1; overflow: hidden; height: 100%;">
                    <div class="toolbar">
                        <div class="nav-icons"><i class="fa-solid fa-chevron-left"></i><i class="fa-solid fa-chevron-right"></i></div>
                        <div class="toolbar-title">Notepad</div>
                    </div>

                    <div class="app-header">
                        <div class="app-info-left">
                            <div class="app-icon"><i class="fa-solid fa-note-sticky"></i></div>
                            <div class="app-text">
                                <input type="text" class="note-title-input" id="title_input_${note.id}" value="${note.title}">
                                <p><span id="status_${note.id}">Tersimpan</span></p>
                            </div>
                        </div>
                    </div>

                    <div class="notepad-container">
                        <textarea id="text_${note.id}" placeholder="Ketik catatan...">${note.content}</textarea>
                    </div>

                    <div class="window-footer">
                        <div class="breadcrumb"><i class="fa-solid fa-laptop"></i> Macintosh HD > Notes</div>
                        <button class="btn-blue" onclick="deleteNote('${note.id}')">Hapus Note</button>
                    </div>
                </div>
            `;

            desktop.appendChild(win);

            const textarea = document.getElementById(`text_${note.id}`);
            const titleInput = document.getElementById(`title_input_${note.id}`);
            let timeout = null;

            const triggerSave = () => {
                document.getElementById(`status_${note.id}`).innerText = "Menyimpan...";
                clearTimeout(timeout);
                timeout = setTimeout(async () => {
                    notesData[note.id].content = textarea.value;
                    notesData[note.id].title = titleInput.value || "Tanpa Judul";
                    await syncNoteToSupabase(note.id);
                }, 500);
            };

            textarea.addEventListener('input', triggerSave);
            titleInput.addEventListener('input', triggerSave);
        }

        function setupInteractJS() {
            interact('.mac-dark-widget')
                .draggable({
                    allowFrom: '.drag-handle',
                    listeners: {
                        start(event) { bringToFront(event.target.id); },
                        move(event) {
                            if (isPortrait()) return;
                            let target = event.target;
                            let x = (parseFloat(target.getAttribute('data-x')) || 0) + event.dx;
                            let y = (parseFloat(target.getAttribute('data-y')) || 0) + event.dy;
                            target.style.transform = `translate(${x}px, ${y}px)`;
                            target.setAttribute('data-x', x);
                            target.setAttribute('data-y', y);
                        },
                        end(event) {
                            if (isPortrait()) return;
                            let id = event.target.id;
                            if (notesData[id]) {
                                notesData[id].x = parseFloat(event.target.getAttribute('data-x'));
                                notesData[id].y = parseFloat(event.target.getAttribute('data-y'));
                                syncNoteToSupabase(id);
                            }
                        }
                    }
                })
                .resizable({
                    edges: { left: false, right: true, bottom: true, top: false },
                    listeners: {
                        start(event) { bringToFront(event.target.id); },
                        move(event) {
                            let target = event.target;
                            let width = event.rect.width;
                            let height = event.rect.height;

                            if (isPortrait()) {
                                target.style.width = '100%';
                                target.style.height = `${height}px`;
                            } else {
                                let x = (parseFloat(target.getAttribute('data-x')) || 0) + event.deltaRect.left;
                                let y = (parseFloat(target.getAttribute('data-y')) || 0) + event.deltaRect.top;
                                Object.assign(target.style, {
                                    width: `${width}px`,
                                    height: `${height}px`,
                                    transform: `translate(${x}px, ${y}px)`
                                });
                                Object.assign(target.dataset, { x, y });
                            }
                        },
                        end(event) {
                            let id = event.target.id;
                            if (notesData[id]) {
                                notesData[id].w = parseFloat(event.target.style.width) || 580;
                                notesData[id].h = parseFloat(event.target.style.height);
                                syncNoteToSupabase(id);
                            }
                        }
                    }
                });
        }
    </script>
</body>
</html>
